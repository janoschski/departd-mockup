<script>// Eigenhosting-Brücke: stellt window.claude.use('db'|'room'|'user'|'downloads') über einen WebSocket-Server bereit.
(function () {
  const space = (new URLSearchParams(location.search).get('space') || 'kaufland-urs').toLowerCase().replace(/[^a-z0-9_-]/g, '').slice(0, 40) || 'kaufland-urs';
  const wsUrl = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws?space=' + encodeURIComponent(space);
  const docs = new Map(); // path -> data
  const listeners = []; // {kind:'col'|'doc', path, orderBy, dir, cb, seen:Map}
  let ws, canWrite = false, ready = false, readyWaiters = [], peers = [], myId = null, peerCbs = [], lastPresence = {}, pendingAuth = null;
  const me = { name: '' };
  function conn() {
    ws = new WebSocket(wsUrl);
    ws.onopen = () => { send({ t: 'hello' }); if (lastPresence && Object.keys(lastPresence).length) send({ t: 'presence', state: lastPresence }); if (window.__pw) send({ t: 'auth', pw: window.__pw }); };
    ws.onmessage = ev => {
      let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (m.t === 'init') { docs.clear(); for (const [p, d] of Object.entries(m.docs)) docs.set(p, d); myId = m.id; canWrite = !!m.canWrite; ready = true; readyWaiters.splice(0).forEach(f => f()); notifyAll(); }
      else if (m.t === 'doc') { if (m.data == null) docs.delete(m.path); else docs.set(m.path, m.data); notifyPath(m.path); }
      else if (m.t === 'peers') { peers = m.peers; peerCbs.forEach(f => f({ peers: peers.map(p => ({ peer: p.id, isMe: p.id === myId, presence: p.state })) })); }
      else if (m.t === 'auth') { canWrite = !!m.ok; if (pendingAuth) { pendingAuth(canWrite); pendingAuth = null; } }
    };
    ws.onclose = () => { setTimeout(conn, 1500); };
  }
  function send(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }
  const split = p => { const i = p.indexOf('/'); return [p.slice(0, i), p.slice(i + 1)]; };
  const mkSnap = (l) => {
    if (l.kind === 'doc') { const d = docs.get(l.path); return { exists: d !== undefined, data: () => d, id: split(l.path)[1] }; }
    const col = l.path + '/'; let arr = [];
    for (const [p, d] of docs) if (p.startsWith(col) && !p.slice(col.length).includes('/')) arr.push({ id: p.slice(col.length), data: () => d, _p: p, _d: d });
    if (l.orderBy) arr.sort((a, b) => { const x = a._d[l.orderBy], y = b._d[l.orderBy]; return (x > y ? 1 : x < y ? -1 : 0) * (l.dir === 'desc' ? -1 : 1); });
    const changes = [];
    const seen = new Map(arr.map(a => [a._p, JSON.stringify(a._d)]));
    for (const a of arr) { const prev = l.seen.get(a._p); if (prev === undefined) changes.push({ type: 'added', doc: a }); else if (prev !== seen.get(a._p)) changes.push({ type: 'modified', doc: a }); }
    for (const [p] of l.seen) if (!seen.has(p)) changes.push({ type: 'removed', doc: { id: p.slice(col.length), data: () => ({}) } });
    l.seen = seen;
    return { docs: arr, docChanges: () => changes, empty: !arr.length };
  };
  function fire(l) { try { l.cb(mkSnap(l)); } catch (e) { console.error(e); } }
  const notifyAll = () => listeners.forEach(fire);
  function notifyPath(p) { for (const l of listeners) { if (l.kind === 'doc' ? l.path === p : p.startsWith(l.path + '/')) fire(l); } }
  const norm = d => JSON.parse(JSON.stringify(d));
  const docRef = path => ({
    path,
    get: async () => { await waitReady(); const d = docs.get(path); return { exists: d !== undefined, data: () => d, id: split(path)[1] }; },
    set: async d => { chk(); d = norm(d); docs.set(path, d); send({ t: 'set', path, data: d }); },
    update: async d => { chk(); d = norm(d); docs.set(path, { ...(docs.get(path) || {}), ...d }); send({ t: 'update', path, data: d }); },
    delete: async () => { chk(); docs.delete(path); send({ t: 'del', path }); },
    onSnapshot: (cb) => { const l = { kind: 'doc', path, cb, seen: new Map() }; listeners.push(l); waitReady().then(() => fire(l)); return () => { const i = listeners.indexOf(l); if (i >= 0) listeners.splice(i, 1); }; }
  });
  const colRef = (path, o = {}) => ({
    doc: id => docRef(path + '/' + id),
    orderBy: (f, dir) => colRef(path, { orderBy: f, dir }),
    onSnapshot: cb => { const l = { kind: 'col', path, orderBy: o.orderBy, dir: o.dir, cb, seen: new Map() }; listeners.push(l); waitReady().then(() => fire(l)); return () => { const i = listeners.indexOf(l); if (i >= 0) listeners.splice(i, 1); }; }
  });
  function chk() { if (!canWrite) { const e = new Error('Nur Ansicht'); e.code = 'invalid_argument'; throw e; } }
  const waitReady = () => ready ? Promise.resolve() : new Promise(r => readyWaiters.push(r));
  const caps = {
    db: { doc: docRef, collection: p => colRef(p) },
    room: { presence: async s => { lastPresence = s; send({ t: 'presence', state: s }); }, onPeers: f => { peerCbs.push(f); f({ peers: peers.map(p => ({ peer: p.id, isMe: p.id === myId, presence: p.state })) }); } },
    user: {
      me: async () => ({ name: me.name }), can: async () => { await waitReady(); return canWrite; }, id: async () => myId, isOwner: () => canWrite, canEdit: () => canWrite,
      unlock: pw => new Promise(res => { window.__pw = pw; pendingAuth = res; send({ t: 'auth', pw }); setTimeout(() => { if (pendingAuth) { pendingAuth(false); pendingAuth = null; } }, 6000); }),
      canWrite: () => canWrite
    },
    downloads: { save: async ({ filename, data }) => { const b = data instanceof Blob ? data : new Blob([data]); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = filename; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); } }
  };
  window.claude = { use: async n => caps[n] || null };
  window.__selfhost = true;
  conn();
})();
</script>

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ROTBTNS = '<div class="rotrow"><button data-act="rot" data-step="-90" title="−90° (Shift+R)">⟲ 90°</button><button data-act="rot" data-step="-15">⟲ 15°</button><button data-act="rot" data-step="15">15° ⟳</button><button data-act="rot" data-step="90" title="+90° (R)">90° ⟳</button></div>';
const uid = () => Math.random().toString(36).slice(2, 10);
const clone = o => JSON.parse(JSON.stringify(o));
const ls = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };

let lang = detectLang(), t = makeT(lang);
const S = { rooms: [{ id: 'main', name: 'Hauptraum' }], objects: {}, catalog: {}, versions: [], editable: false, you: 'me', clients: [], room: 'main', sel: new Set(), snap: true, showNotes: false, openNotes: new Set(), connected: false };
const COLORS = ['#e53935', '#fb8c00', '#fdd835', '#43a047', '#00acc1', '#1e88e5', '#8e24aa', '#ec407a', '#6d4c41', '#9e9e9e', '#37474f', '#ffffff'];
const openCats = new Set(['basis']);
let myName = ls.get('dm_name') || '', myColor = ls.get('dm_color') || ['#e53935', '#1e88e5', '#43a047', '#8e24aa', '#fb8c00', '#00897b', '#d81b60'][Math.floor(Math.random() * 7)];
ls.set('dm_color', myColor);
const caps = { db: null, room: null, user: null, downloads: null, sample: null };
let backendState = 'loading'; // loading | ready | unavailable

// ---------- Dialoge (alert/confirm/prompt sind im Viewer blockiert) ----------
function dialog({ msg, input = null, okLabel = 'OK', cancel = true }) {
  return new Promise(res => {
    const m = $('#modal'); m.innerHTML = `<div class="box"><div class="msg">${esc(msg)}</div>${input !== null ? `<input type="text" id="dlgIn" value="${esc(input)}">` : ''}<div class="row" style="justify-content:flex-end;margin-top:12px">${cancel ? `<button id="dlgNo">${esc(lang === 'de' ? 'Abbrechen' : lang === 'zh' ? '取消' : 'Cancel')}</button>` : ''}<button class="primary" id="dlgOk">${esc(okLabel)}</button></div></div>`;
    m.hidden = false; const inp = $('#dlgIn'); if (inp) { inp.focus(); inp.select(); } else $('#dlgOk').focus();
    const done = v => { m.hidden = true; m.innerHTML = ''; res(v); };
    $('#dlgOk').onclick = () => done(inp ? inp.value : true);
    if ($('#dlgNo')) $('#dlgNo').onclick = () => done(inp ? null : false);
    m.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); $('#dlgOk').click(); } else if (e.key === 'Escape' && cancel) { e.preventDefault(); done(inp ? null : false); } };
  });
}
const askText = (msg, def = '') => dialog({ msg, input: def });
const askConfirm = msg => dialog({ msg });

// ---------- Backend ----------
const wq = []; let pumping = false;
function enqueue(task) {
  if (task.kind === 'patch') { const prev = [...wq].reverse().find(x => x.id === task.id); if (prev && prev.kind === 'patch') { Object.assign(prev.p, task.p); return pump(); } }
  wq.push(task); pump();
}
async function pump() {
  if (pumping) return; pumping = true;
  while (wq.length) {
    const it = wq.shift();
    try { await runTask(it); }
    catch (e) { if (it.kind !== 'patch' && it.kind !== 'del' && e && e.code === 'invalid_argument') { S.editable = false; renderHeader(); renderLeft(); renderRight(true); toast(t('denied')); } else if (e && e.code === 'quota_exceeded') toast('Speicherlimit erreicht'); }
  }
  pumping = false;
}
async function runTask(it) {
  const db = caps.db; if (!db) return;
  if (it.kind === 'put') {
    let o = it.o; if (JSON.stringify(o).length > 240000) { o = { ...o, img: '', photo: '' }; toast('Bild zu groß – ohne Bild gespeichert'); }
    await db.doc('o/' + o.id).set(o);
  } else if (it.kind === 'patch') {
    if (JSON.stringify(it.p).length > 240000) { toast('Bild zu groß'); return; }
    await db.doc('o/' + it.id).update(it.p);
  } else if (it.kind === 'del') await db.doc('o/' + it.id).delete();
  else if (it.kind === 'room') await db.doc('rooms/' + it.id).set({ name: it.name, ts: it.ts });
  else if (it.kind === 'delroom') await db.doc('rooms/' + it.id).delete();
  else if (it.kind === 'cat') await db.doc('meta/catalog').set({ names: clone(S.catalog) });
  else if (it.kind === 'ver') { await db.doc('vsnap/' + it.id).set({ snap: it.snap }); await db.doc('vmeta/' + it.id).set({ name: it.name, ts: it.ts }); }
  else if (it.kind === 'delver') { await db.doc('vmeta/' + it.id).delete(); await db.doc('vsnap/' + it.id).delete(); }
}
function tasksFor(ops) {
  const tasks = [];
  for (const op of ops) {
    if (op.op === 'put') tasks.push({ kind: 'put', o: clone(op.o) });
    else if (op.op === 'patch') tasks.push({ kind: 'patch', id: op.id, p: clone(op.p) });

function applyOp(op) {
  if (op.op === 'put') S.objects[op.o.id] = op.o;
  else if (op.op === 'patch') { const o = S.objects[op.id]; if (o) Object.assign(o, op.p); }
  else if (op.op === 'del') { delete S.objects[op.id]; S.sel.delete(op.id); }
  else if (op.op === 'room') { const r = S.rooms.find(x => x.id === op.room.id); if (r) r.name = op.room.name; else S.rooms.push({ ...op.room, ts: Date.now() }); }
  else if (op.op === 'delroom') {
    S.rooms = S.rooms.filter(r => r.id !== op.id);
    for (const id of Object.keys(S.objects)) if (S.objects[id].room === op.id) { delete S.objects[id]; S.sel.delete(id); }
    if (S.room === op.id) S.room = 'main';
  }
  else if (op.op === 'cat') { if (op.name) S.catalog[op.type] = op.name; else delete S.catalog[op.type]; }
}
const undoStack = [];
function commit(ops, undo = true) {
  if (!S.editable) { toast(t('viewOnly')); return false; }
  if (!S.connected) { toast(t('reconnecting')); return false; }
  const inv = [];
  for (const op of ops) {
    const prev = S.objects[op.id || (op.o && op.o.id)];
    if (op.op === 'put') inv.unshift(prev ? { op: 'put', o: clone(prev) } : { op: 'del', id: op.o.id });
    else if (op.op === 'patch' && prev) { const p = {}; for (const k of Object.keys(op.p)) p[k] = prev[k]; inv.unshift({ op: 'patch', id: op.id, p }); }
    else if (op.op === 'del' && prev) inv.unshift({ op: 'put', o: clone(prev) });
  }
  const tasks = tasksFor(ops);
  ops.forEach(applyOp);
  tasks.forEach(enqueue);
  if (undo && inv.length) { undoStack.push(inv); if (undoStack.length > 100) undoStack.shift(); }
  eng.refresh(); renderLeft(); renderRight(false); renderHeader(); sendPresence();
  return true;
}
function patchObjects(list, undo = true) {
  const ops = [];
  for (const { id, p } of list) {
    const o = S.objects[id]; if (!o) continue;
    ops.push({ op: 'patch', id, p });
    if (o.room === 'main' && o.type === 'person') {
      const q = {}; for (const k of ['name', 'photo', 'group']) if (k in p) q[k] = p[k];
      if (Object.keys(q).length) for (const c of Object.values(S.objects)) if (c.src === id) { const cq = { ...q }; if ('name' in q) { const sp = splitTag(c.name); cq.name = sp.tag ? `${q.name} – ${sp.tag}` : q.name; } ops.push({ op: 'patch', id: c.id, p: cq }); }
    }
  }
  if (ops.length) commit(ops, undo);
}
function undo() { const inv = undoStack.pop(); if (inv) { commit(inv, false); for (const id of [...S.sel]) if (!S.objects[id]) S.sel.delete(id); eng.refresh(); renderRight(true); } }

function aiBuild(plan) {

  const roomId = r => { if (r == null) return S.room; if (newRooms[r]) return newRooms[r]; const f = S.rooms.find(x => x.id === r || x.name === r); return f ? f.id : (S.rooms.find(x => x.id === S.room) ? S.room : 'main'); };
  const clampP = (p, o) => {
    const q = {};
    for (const [k, [lo, hi]] of Object.entries({ x: [-350, 350], z: [-250, 250], y: [0, 600], rot: [-3600, 3600], w: [1, 800], d: [1, 800], h: [1, 600], bicep: [0.5, 3] })) if (k in p) { const v = num(p[k], lo, hi); if (v != null) q[k] = k === 'bicep' ? v : Math.round(v); }
    if ('color' in p && /^#[0-9a-f]{6}$/i.test(p.color)) q.color = p.color;
    if ('name' in p) q.name = String(p.name).slice(0, 80);
    if ('note' in p) q.note = String(p.note).slice(0, 400);
    if ('pose' in p && POSE_IDS.includes(p.pose) && (!o || o.type === 'person')) q.pose = p.pose;
    if ('basket' in p && (!o || o.type === 'person')) q.basket = !!p.basket;
    return q;
  };
  for (const op of (plan.ops || []).slice(0, 60)) {
    if (!op || typeof op !== 'object') continue;
    if (op.op === 'addRoom') { const id = 'r' + uid(); newRooms[op.ref || op.name] = id; newRooms[op.name] = id; ops.push({ op: 'room', room: { id, name: String(op.name || 'Set').slice(0, 60) } }); nRoom++; }
    else if (op.op === 'add' && DEFS[op.type] && op.type !== 'person') {
      const rid = roomId(op.room); const o = newObject(op.type, rid); Object.assign(o, clampP(op, null)); o.room = rid;
      if (!('x' in op) && !('z' in op)) { const sp = freeSpot(o, rid, roomObjs(rid).length + nAdd); o.x = sp.x; o.z = sp.z; }
      ops.push({ op: 'put', o }); nAdd++;
    } else if (op.op === 'addPerson') {
      const m = S.objects[op.main]; if (!m || m.room !== 'main' || m.type !== 'person') continue;
      const rid = roomId(op.room); if (rid === 'main') continue;
      const pose = POSE_IDS.includes(op.pose) ? op.pose : m.pose;
      const c = clone(m); c.id = uid(); c.room = rid; c.src = m.id; c.pose = pose; c.name = nameFor(splitTag(m.name).base, pose); c.rot = 0; c.y = 0;
      Object.assign(c, clampP({ x: op.x, z: op.z, rot: op.rot, basket: op.basket, bicep: op.bicep }, c));
      if (op.x == null && op.z == null) { const sp = freeSpot(c, rid, roomObjs(rid).length + nAdd); c.x = sp.x; c.z = sp.z; }
      ops.push({ op: 'put', o: c }); nAdd++;
    } else if (op.op === 'set' && S.objects[op.id] && op.p && typeof op.p === 'object') {
      const q = clampP(op.p, S.objects[op.id]); if (Object.keys(q).length) { ops.push({ op: 'patch', id: op.id, p: q }); nSet++; }
    } else if (op.op === 'del' && S.objects[op.id]) { ops.push({ op: 'del', id: op.id }); nDel++; }
  }
  return { ops, nAdd, nSet, nDel, nRoom };
}
async function aiRun() {
  const text = aiIn.value.trim(); if (!text || aiBusy) return;
  if (!S.editable) { toast(t('viewOnly')); return; }
  aiBusy = true; aiGo.disabled = true; aiSt.textContent = 'Claude denkt nach …';
  try {
    const plan = await caps.sample.json(aiPrompt(text), { modelTier: 'default', cache: false });
    if (!plan || typeof plan !== 'object' || !Array.isArray(plan.ops)) throw new Error('Antwort unlesbar');
    const r = aiBuild(plan);
    if (r.ops.length) {
      const had = new Set(Object.keys(S.objects));
      // Rauminfos (ohne Undo) zuerst, Objekte danach als ein rückgängig-machbarer Schritt
      const roomOps = r.ops.filter(o => o.op === 'room'), rest = r.ops.filter(o => o.op !== 'room');
      if (roomOps.length) commit(roomOps, false);
      if (rest.length && !commit(rest)) throw new Error('Nicht gespeichert');
      const added = rest.filter(o => o.op === 'put' && !had.has(o.o.id)).map(o => o.o.id);
      if (added.length) { S.sel = new Set(added.filter(id => S.objects[id] && S.objects[id].room === S.room)); eng.refresh(); renderRight(true); }
      aiSt.textContent = `✓ ${plan.summary || 'Erledigt'} (+${r.nAdd} · ✎${r.nSet} · −${r.nDel}${r.nRoom ? ' · ' + r.nRoom + ' Raum' : ''}) – Strg+Z macht rückgängig`;
      aiIn.value = '';
    } else aiSt.textContent = (plan.summary || 'Keine Änderung nötig.') + ' (keine Änderungen)';
  } catch (e) {
    aiSt.textContent = e && e.code === 'not_granted' ? 'Zugriff auf Claude wurde nicht erlaubt.' : e && e.code === 'rate_limited' ? 'Gerade zu viele Anfragen – bitte kurz warten.' : 'Das hat nicht geklappt: ' + ((e && e.message) || 'Fehler');
  }
  aiBusy = false; aiGo.disabled = false;
}
aiGo.addEventListener('click', aiRun);
aiIn.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); aiRun(); } });

$('#pwBtn').addEventListener('click', async () => {
  if (!(window.__selfhost && caps.user && caps.user.unlock) || S.editable) return;
  const pw = await askText('Bearbeitungs-Passwort', ''); if (!pw) return;
  const ok = await caps.user.unlock(pw);
  if (ok) { S.editable = true; renderAll(); eng.refresh(); toast('Bearbeitung aktiv'); } else toast('Falsches Passwort');
});
renderAll(); eng.refresh(); initBackend();
window.__dm = { S, eng, commit, caps };

</script>
